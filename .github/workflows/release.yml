# Builds the player release packages. Runs only when started by hand (Actions > Release >
# Run workflow) or when a version tag such as v0.2 (or v0.2.1 for a hotfix) is pushed; never on ordinary pushes.
#
# Secrets (Settings > Secrets and variables > Actions):
#   HF_TOKEN         read access to the private Hugging Face bucket with the trained models
#   HF_PACKS_TOKEN   WRITE access to the Hugging Face model repository that hosts the optional packs (HF_PACKS_REPO below,
#                    owned by the alystria-ai account); the first upload creates it, private
#   CONVAI_AUTH_CLIENT_SECRET  the token backend's client request secret, built into the Runtime package as app/defaults/convai-auth.json
#                    (at least 32 characters; never the error reports' secret). The Runtime ships NO Convai key: players reach the
#                    shared Convai account with short-lived tokens from the token backend (auth-backend/, docs/CONVAI_AUTH_BACKEND.md)
#
# Variables (Settings > Secrets and variables > Actions > Variables):
#   CONVAI_AUTH_URL  the token backend's address, https://<backend>/api/convai/token (not secret). A Runtime build without both
#                    CONVAI_AUTH_URL and CONVAI_AUTH_CLIENT_SECRET fails: it never ships without the backend
#   CONVAI_AUTH_BACKUP_URL  optional: the second token backend's address (the Cloudflare Worker, auth-backend-cf/),
#                    https://<worker>/api/convai/token (not secret), shipped as "backupUrl" in convai-auth.json. Unset: the Runtime has one backend
#
# The Scripts and Runtime packages are uploaded to a release in this same repository with the built-in GITHUB_TOKEN
# (permission: contents: write), and the release is published immediately. While the repository
# is private, only collaborators can see it. The Scripts package is also kept as a workflow
# artifact for uploading to Nexus Mods. The Runtime package carries the native plugin, which the
# build compiles with MSVC and CMake (both are on the Windows runner; the RED4ext SDK is fetched by
# CMake at the commit pinned in native/core/CMakeLists.txt). The OmniVoice pack, the two Local AI
# packs and the two Mature packs are built by their own jobs and uploaded to the Hugging Face repository HF_PACKS_REPO,
# one zip each (no parts), in its own folder of the repository (local-ai/, mature/, mic/, voice/) under its unversioned name, with no checksum file; they are not attached to the GitHub
# release. The Mature packs have an opt-in job (the `mature` input, off by default, never on a tag push), and so do the two voice-input
# packs, MicPack-European and MicPack-Asian (the `micpacks` input, same rules). See docs/PACKAGING.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, 0.N or 0.N.M for a hotfix (for example 0.2 or 0.2.1)
        required: true
      omni:
        description: Also build the optional OmniVoice pack (uploaded to Hugging Face)
        type: boolean
        default: true
      localai:
        description: Also build the two optional Local AI packs, standard and lite (uploaded to Hugging Face)
        type: boolean
        default: true
      mature:
        description: Also build the two optional Mature packs, lite and standard (uploaded to Hugging Face)
        type: boolean
        default: false
      micpacks:
        description: Also build the two optional voice-input packs, MicPack-European and MicPack-Asian (uploaded to Hugging Face)
        type: boolean
        default: false
      publish:
        description: Create the GitHub release (Scripts and Runtime) and upload the optional packs to Hugging Face
        type: boolean
        default: true
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.21.0'
  PYTHON_VERSION: '3.12.10'
  HF_PACKS_REPO: alystria-ai/ai-npc-cyberpunk-mod-packs
  OUT: C:\cpc\release
  CACHE: C:\cpc\cache
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  runtime:
    name: Scripts and Runtime
    # windows-2022 carries Visual Studio 2022; windows-2025 moved to Visual Studio 2026 (MSVC 14.51), which the native
    # plugin's CMake generator and the vision helper's /await coroutines do not build with yet.
    runs-on: windows-2022
    timeout-minutes: 120
    # The only job that writes to the repository: its last step creates the GitHub release and uploads Scripts and Runtime.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Release version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '${{ inputs.version }}' }
          if ($version -notmatch '^\d+(\.\d+){1,3}([-+][0-9A-Za-z.-]+)?$') { throw "Invalid version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r packaging/ci-tools.requirements.txt
          npm ci --ignore-scripts --no-audit --no-fund

      # The Mistral voice's reference clips are cut and encoded to MP3 at build time (bridge/voxtral-reference.mjs), so players need no ffmpeg.
      # ffmpeg is the pinned gyan.dev essentials build (it has libvorbis and libmp3lame), downloaded from its release page and checked against
      # the SHA-256 the publisher lists for that file; to move to a newer build, change all three FFMPEG_ values together.
      - name: ffmpeg (pre-builds the Mistral voice references)
        shell: pwsh
        env:
          FFMPEG_VERSION: '9.0.2'
          FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip
          FFMPEG_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile $zip -MaximumRetryCount 4 -RetryIntervalSec 5
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:FFMPEG_SHA256) { throw "Checksum mismatch for $env:FFMPEG_URL : expected $env:FFMPEG_SHA256, got $actual" }
          $target = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Expand-Archive $zip -DestinationPath $target -Force
          $bin = Join-Path (Join-Path $target "ffmpeg-$env:FFMPEG_VERSION-essentials_build") 'bin'
          $env:Path = "$bin;$env:Path"
          $bin >> $env:GITHUB_PATH
          $ffmpeg = Get-Command ffmpeg -ErrorAction Stop
          & $ffmpeg.Source -version | Select-Object -First 1

      - name: Release pipeline tests
        run: node --test packaging/release.test.mjs

      - name: Native toolchain (MSVC and CMake build the native plugin)
        shell: pwsh
        run: |
          cmake --version | Select-Object -First 1
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -version '[17.0,18.0)' -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property displayName
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Visual Studio 2022 with the C++ tools is required to build the native plugin.' }
          $vs

      - name: Build Scripts and Runtime
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CONVAI_AUTH_URL: ${{ vars.CONVAI_AUTH_URL }}
          CONVAI_AUTH_BACKUP_URL: ${{ vars.CONVAI_AUTH_BACKUP_URL }}
          CONVAI_AUTH_CLIENT_SECRET: ${{ secrets.CONVAI_AUTH_CLIENT_SECRET }}
        run: |
          Get-PSDrive C | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
          node packaging/build-release.mjs --version "${{ steps.version.outputs.version }}" --packages scripts,runtime `
            --models hf --out $env:OUT --cache $env:CACHE

      - name: Clean-install test
        shell: pwsh
        run: node packaging/test-release-install.mjs --packages "$env:OUT\packages" --version "${{ steps.version.outputs.version }}" --host "$env:OUT\native\test-host.exe"

      # The Full install zip: the update and the Runtime base in one (packaging/build-full.mjs; it stops when the two overlap).
      - name: Build the Full install zip
        shell: pwsh
        run: node packaging/build-full.mjs --version "${{ steps.version.outputs.version }}" --packages "$env:OUT\packages"

      - name: Keep the Full install and Update zips for Nexus Mods
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AI-Companions-LLM-${{ steps.version.outputs.version }}
          path: |
            ${{ env.OUT }}\packages\AI-Companions-LLM-*.zip
            ${{ env.OUT }}\packages\release-manifest.json
          retention-days: 30

      - name: Publish the GitHub release
        if: github.ref_type == 'tag' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          # A manual run tags the commit it was started from; a tag run already has its tag.
          # --latest: always mark the newest build as the Latest release.
          $createArgs = @('release', 'create', $tag, '--repo', $env:GITHUB_REPOSITORY, '--target', $env:GITHUB_SHA, '--title', "AI NPC Cyberpunk Mod $version", '--notes-file', $notes, '--latest')
          # The release page is long and its files sit at the very bottom under Assets, so the notes start by saying so, with direct links.
          # This note is only on the release page, not in the README.txt inside the zips.
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag"
          $from = (Get-Content packaging/release.config.json -Raw | ConvertFrom-Json).runtimeBase.required
          $update = "AI-Companions-LLM-Update-$from-to-$version.zip"
          $download = "> **The download files are at the very bottom of this page, under Assets.** Scroll all the way down, or use these links:`n>`n> - [AI-Companions-LLM-$version.zip]($base/AI-Companions-LLM-$version.zip): the full install, everything in one zip (also on Nexus Mods)`n> - [$update]($base/$update): the update for an install that already has the Runtime $from or newer (also on Nexus Mods)`n> - [Runtime-$version.zip]($base/Runtime-$version.zip): the Runtime alone, for Vortex and Mod Organizer 2`n>`n> Then follow **Install** below.`n`n"
          $download + (Get-Content packaging/PLAYER_README.md -Raw) | Set-Content $notes -Encoding utf8
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh @createArgs
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the release.' }
          } else {
            # A rebuild of an existing release refreshes its notes too, so they match the README.txt in the new zips.
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "AI NPC Cyberpunk Mod $version" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not update the release notes.' }
          }
          $files = @(Get-ChildItem "$env:OUT\packages" -Filter *.zip | ForEach-Object FullName)
          gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber @files
          if ($LASTEXITCODE -ne 0) { throw 'Uploading the packages failed.' }

  # The optional packs go to the Hugging Face model repository HF_PACKS_REPO, one zip each (no parts), in its own folder of the repository
  # (packaging/upload-packs.py), with no checksum file. They are not attached to the GitHub release. Each job checks first that the
  # HF_PACKS_TOKEN secret can write to that repository, so a read-only token fails in seconds, not after the build.
  omni:
    name: OmniVoice pack
    needs: runtime
    if: github.ref_type == 'tag' || inputs.omni
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r packaging/ci-tools.requirements.txt
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Check the Hugging Face upload access
        if: github.ref_type == 'tag' || inputs.publish
        shell: pwsh
        env:
          HF_PACKS_TOKEN: ${{ secrets.HF_PACKS_TOKEN }}
        run: |
          python packaging/upload-packs.py --check
          if ($LASTEXITCODE -ne 0) { throw "The HF_PACKS_TOKEN secret needs write access to the Hugging Face repository $env:HF_PACKS_REPO." }

      # The Mistral voice's reference clips are cut and encoded to MP3 at build time (bridge/voxtral-reference.mjs), so players need no ffmpeg.
      # ffmpeg is the pinned gyan.dev essentials build (it has libvorbis and libmp3lame), downloaded from its release page and checked against
      # the SHA-256 the publisher lists for that file; to move to a newer build, change all three FFMPEG_ values together.
      - name: ffmpeg (pre-builds the Mistral voice references)
        shell: pwsh
        env:
          FFMPEG_VERSION: '9.0.2'
          FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip
          FFMPEG_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile $zip -MaximumRetryCount 4 -RetryIntervalSec 5
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:FFMPEG_SHA256) { throw "Checksum mismatch for $env:FFMPEG_URL : expected $env:FFMPEG_SHA256, got $actual" }
          $target = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Expand-Archive $zip -DestinationPath $target -Force
          $bin = Join-Path (Join-Path $target "ffmpeg-$env:FFMPEG_VERSION-essentials_build") 'bin'
          $env:Path = "$bin;$env:Path"
          $bin >> $env:GITHUB_PATH
          $ffmpeg = Get-Command ffmpeg -ErrorAction Stop
          & $ffmpeg.Source -version | Select-Object -First 1

      - name: Build the OmniVoice pack
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          Get-PSDrive C | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
          node packaging/build-release.mjs --version "${{ needs.runtime.outputs.version }}" --packages omni `
            --models hf --out $env:OUT --cache $env:CACHE
          Remove-Item -Recurse -Force "$env:OUT\stage" -ErrorAction SilentlyContinue
          Get-ChildItem "$env:OUT\packages" -Filter *.zip | Format-Table Name, @{n='GB';e={[math]::Round($_.Length/1GB,2)}}

      - name: Upload the OmniVoice pack to Hugging Face
        if: github.ref_type == 'tag' || inputs.publish
        shell: pwsh
        env:
          HF_PACKS_TOKEN: ${{ secrets.HF_PACKS_TOKEN }}
        run: |
          python packaging/upload-packs.py --version "${{ needs.runtime.outputs.version }}" --pack omni --packages "$env:OUT\packages"
          if ($LASTEXITCODE -ne 0) { throw "Uploading the OmniVoice pack to Hugging Face failed (the HF_PACKS_TOKEN secret needs write access to $env:HF_PACKS_REPO)." }

  # The optional Mature packs (packaging/MATURE_PACK_README.md): opt-in only (the `mature` input, default off), so never on a tag push.
  # Two packs, lite and standard, one model each, built and uploaded by one job each; they live on Hugging Face only, never Nexus and not the
  # GitHub release. Each model comes from the private bucket's mirror (HF_TOKEN), with the pinned public URL as fallback.
  mature:
    name: Mature pack (${{ matrix.tier }})
    needs: runtime
    if: inputs.mature
    runs-on: windows-2025
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        tier: [lite, standard]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r packaging/ci-tools.requirements.txt
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Check the Hugging Face upload access
        if: inputs.publish
        shell: pwsh
        env:
          HF_PACKS_TOKEN: ${{ secrets.HF_PACKS_TOKEN }}
        run: |
          python packaging/upload-packs.py --check
          if ($LASTEXITCODE -ne 0) { throw "The HF_PACKS_TOKEN secret needs write access to the Hugging Face repository $env:HF_PACKS_REPO." }

      - name: Build the Mature pack
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          Get-PSDrive C | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
          node packaging/build-release.mjs --version "${{ needs.runtime.outputs.version }}" --packages "mature-${{ matrix.tier }}" `
            --models hf --out $env:OUT --cache $env:CACHE
          Remove-Item -Recurse -Force "$env:OUT\stage" -ErrorAction SilentlyContinue
          Get-ChildItem "$env:OUT\packages" -Filter *.zip | Format-Table Name, @{n='GB';e={[math]::Round($_.Length/1GB,2)}}

      - name: Upload the Mature pack to Hugging Face
        if: inputs.publish
        shell: pwsh
        env:
          HF_PACKS_TOKEN: ${{ secrets.HF_PACKS_TOKEN }}
        run: |
          python packaging/upload-packs.py --version "${{ needs.runtime.outputs.version }}" --pack "mature-${{ matrix.tier }}" --packages "$env:OUT\packages"
          if ($LASTEXITCODE -ne 0) { throw "Uploading the Mature pack to Hugging Face failed (the HF_PACKS_TOKEN secret needs write access to $env:HF_PACKS_REPO)." }

  # The optional voice-input packs (docs/LOCAL_STT.md, "The optional packs"): opt-in only (the `micpacks` input, default off), so never on a tag push.
  # Two packs, MicPack-European and MicPack-Asian, one job each; they live on Hugging Face only, never Nexus and not the GitHub release. The model
  # files are downloaded from the pinned sherpa-onnx release archive and checked against the SHA-256 in packaging/release.config.json, so the build needs
  # no secret: no --models hf, no HF_TOKEN (only the upload uses HF_PACKS_TOKEN).
  micpacks:
    name: Voice-input pack (${{ matrix.pack }})
    needs: runtime
    if: inputs.micpacks
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        pack: [european, asian]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build tools
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r packaging/ci-tools.requirements.txt

      - name: Check the Hugging Face upload access
        if: inputs.publish
        shell: pwsh
        env:
          HF_PACKS_TOKEN: ${{ secrets.HF_PACKS_TOKEN }}
        run: |
          python packaging/upload-packs.py --check
          if ($LASTEXITCODE -ne 0) { throw "The HF_PACKS_TOKEN secret needs write access to the Hugging Face repository $env:HF_PACKS_REPO." }

      - name: Build the voice-input pack
        shell: pwsh
        run: |
          Get-PSDrive C | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
          node packaging/build-release.mjs --version "${{ needs.runtime.outputs.version }}" --packages "micpack-${{ matrix.pack }}" `
            --out $env:OUT --cache $env:CACHE
          Remove-Item -Recurse -Force "$env:OUT\stage" -ErrorAction SilentlyContinue
          Get-ChildItem "$env:OUT\packages" -Filter *.zip | Format-Table Name, @{n='GB';e={[math]::Round($_.Length/1GB,2)}}

      - name: Upload the voice-input pack to Hugging Face
        if: inputs.publish
        shell: pwsh
        env:
          HF_PACKS_TOKEN: ${{ secrets.HF_PACKS_TOKEN }}
        run: |
          python packaging/upload-packs.py --version "${{ needs.runtime.outputs.version }}" --pack "micpack-${{ matrix.pack }}" --packages "$env:OUT\packages"
          if ($LASTEXITCODE -ne 0) { throw "Uploading the voice-input pack to Hugging Face failed (the HF_PACKS_TOKEN secret needs write access to $env:HF_PACKS_REPO)." }

  localai:
    name: Local AI pack (${{ matrix.tier }})
    needs: runtime
    if: github.ref_type == 'tag' || inputs.localai
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        tier: [standard, lite]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build tools
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r packaging/ci-tools.requirements.txt

      - name: Check the Hugging Face upload access
        if: github.ref_type == 'tag' || inputs.publish
        shell: pwsh
        env:
          HF_PACKS_TOKEN: ${{ secrets.HF_PACKS_TOKEN }}
        run: |
          python packaging/upload-packs.py --check
          if ($LASTEXITCODE -ne 0) { throw "The HF_PACKS_TOKEN secret needs write access to the Hugging Face repository $env:HF_PACKS_REPO." }

      # The packs hold unmodified upstream files (the llama.cpp build and the GGUF models), each downloaded from its pinned
      # URL and checked against the SHA-256 in packaging/release.config.json. The build needs no secret.
      - name: Build the Local AI pack
        shell: pwsh
        run: |
          Get-PSDrive C | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
          node packaging/build-release.mjs --version "${{ needs.runtime.outputs.version }}" --packages "localai-${{ matrix.tier }}" `
            --models hf --out $env:OUT --cache $env:CACHE
          Remove-Item -Recurse -Force "$env:OUT\stage" -ErrorAction SilentlyContinue
          Get-ChildItem "$env:OUT\packages" -Filter *.zip | Format-Table Name, @{n='GB';e={[math]::Round($_.Length/1GB,2)}}

      - name: Upload the Local AI pack to Hugging Face
        if: github.ref_type == 'tag' || inputs.publish
        shell: pwsh
        env:
          HF_PACKS_TOKEN: ${{ secrets.HF_PACKS_TOKEN }}
        run: |
          python packaging/upload-packs.py --version "${{ needs.runtime.outputs.version }}" --pack "localai-${{ matrix.tier }}" --packages "$env:OUT\packages"
          if ($LASTEXITCODE -ne 0) { throw "Uploading the Local AI pack to Hugging Face failed (the HF_PACKS_TOKEN secret needs write access to $env:HF_PACKS_REPO)." }
