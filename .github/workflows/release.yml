# Builds the player release packages. Runs only when started by hand (Actions > Release >
# Run workflow) or when a version tag such as v0.2 (or v0.2.1 for a hotfix) is pushed; never on ordinary pushes.
#
# Secrets (Settings > Secrets and variables > Actions):
#   HF_TOKEN         read access to the private Hugging Face bucket with the trained models, and WRITE access to the
#                    Hugging Face model repository that hosts the optional packs (HF_PACKS_REPO below)
#   CONVAI_API_KEY   the Convai key built into the Runtime package
#
# The Scripts and Runtime packages are uploaded to a release in this same repository with the built-in GITHUB_TOKEN
# (permission: contents: write), and the release is published immediately. While the repository
# is private, only collaborators can see it. The Scripts package is also kept as a workflow
# artifact for uploading to Nexus Mods. The Runtime package carries the native plugin, which the
# build compiles with MSVC and CMake (both are on the Windows runner; the RED4ext SDK is fetched by
# CMake at the commit pinned in native/core/CMakeLists.txt). The OmniVoice pack, the two Local AI
# packs and the two Mature packs are built by their own jobs and uploaded to the Hugging Face repository HF_PACKS_REPO,
# one zip each (no parts), in a folder per version, with a SHA256SUMS-<pack>.txt beside it; they are not attached to the GitHub
# release. The Mature packs have an opt-in job (the `mature` input, off by default, never on a tag push). See docs/PACKAGING.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, 0.N or 0.N.M for a hotfix (for example 0.2 or 0.2.1)
        required: true
      omni:
        description: Also build the optional OmniVoice pack (uploaded to Hugging Face)
        type: boolean
        default: true
      localai:
        description: Also build the two optional Local AI packs, standard and lite (uploaded to Hugging Face)
        type: boolean
        default: true
      mature:
        description: Also build the two optional Mature packs, lite and good (uploaded to Hugging Face)
        type: boolean
        default: false
      publish:
        description: Create the GitHub release (Scripts and Runtime) and upload the optional packs to Hugging Face
        type: boolean
        default: true
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.21.0'
  PYTHON_VERSION: '3.12.10'
  PIP_VERSION: '25.2'
  HF_HUB_VERSION: '1.33.0'
  HF_PACKS_REPO: akshitireddy/cyberpunk-convai-packs
  OUT: C:\cpc\release
  CACHE: C:\cpc\cache
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  runtime:
    name: Scripts and Runtime
    # windows-2022 carries Visual Studio 2022; windows-2025 moved to Visual Studio 2026 (MSVC 14.51), which the native
    # plugin's CMake generator and the vision helper's /await coroutines do not build with yet.
    runs-on: windows-2022
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Release version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '${{ inputs.version }}' }
          if ($version -notmatch '^\d+(\.\d+){1,3}([-+][0-9A-Za-z.-]+)?$') { throw "Invalid version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pip==$env:PIP_VERSION" "huggingface_hub==$env:HF_HUB_VERSION"
          npm ci --no-audit --no-fund

      # The Mistral voice's reference clips are cut and encoded to MP3 at build time (bridge/voxtral-reference.mjs), so players need no ffmpeg.
      - name: ffmpeg (pre-builds the Mistral voice references)
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress; if ($LASTEXITCODE -ne 0) { throw 'Could not install ffmpeg.' } }
          $ffmpeg = Get-Command ffmpeg -ErrorAction Stop
          & $ffmpeg.Source -version | Select-Object -First 1

      - name: Release pipeline tests
        run: node --test packaging/release.test.mjs

      - name: Native toolchain (MSVC and CMake build the native plugin)
        shell: pwsh
        run: |
          cmake --version | Select-Object -First 1
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -version '[17.0,18.0)' -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property displayName
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Visual Studio 2022 with the C++ tools is required to build the native plugin.' }
          $vs

      - name: Build Scripts and Runtime
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CONVAI_API_KEY: ${{ secrets.CONVAI_API_KEY }}
        run: |
          Get-PSDrive C | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
          node packaging/build-release.mjs --version "${{ steps.version.outputs.version }}" --packages scripts,runtime `
            --models hf --key-env CONVAI_API_KEY --out $env:OUT --cache $env:CACHE

      - name: Clean-install test
        shell: pwsh
        run: node packaging/test-release-install.mjs --packages "$env:OUT\packages" --version "${{ steps.version.outputs.version }}" --host "$env:OUT\native\test-host.exe"

      - name: Keep the Scripts package for Nexus Mods
        uses: actions/upload-artifact@v4
        with:
          name: CyberpunkConvai-Scripts-${{ steps.version.outputs.version }}
          path: |
            ${{ env.OUT }}\packages\CyberpunkConvai-Scripts-*.zip
            ${{ env.OUT }}\packages\SHA256SUMS.txt
            ${{ env.OUT }}\packages\release-manifest.json
          retention-days: 30

      - name: Publish the GitHub release
        if: github.ref_type == 'tag' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          # A manual run tags the commit it was started from; a tag run already has its tag.
          # --latest: always mark the newest build as the Latest release.
          $createArgs = @('release', 'create', $tag, '--repo', $env:GITHUB_REPOSITORY, '--target', $env:GITHUB_SHA, '--title', "Cyberpunk Convai $version", '--notes-file', $notes, '--latest')
          (Get-Content packaging/PLAYER_README.md -Raw) + "`n## Checksums`n`nSHA-256 values for the files on this page are in SHA256SUMS-runtime.txt below. Each optional pack on Hugging Face has its own SHA256SUMS file next to it.`n" | Set-Content $notes -Encoding utf8
          Copy-Item "$env:OUT\packages\SHA256SUMS.txt" "$env:OUT\packages\SHA256SUMS-runtime.txt"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh @createArgs
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the release.' }
          }
          $files = @(Get-ChildItem "$env:OUT\packages" -Filter *.zip | ForEach-Object FullName)
          gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber @files "$env:OUT\packages\SHA256SUMS-runtime.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Uploading the packages failed.' }

  # The optional packs go to the Hugging Face model repository HF_PACKS_REPO, one zip each (no parts), in a folder per version, next to a
  # SHA256SUMS-<pack>.txt (packaging/upload-packs.py). They are not attached to the GitHub release. Each job checks first that the
  # HF_TOKEN secret can write to that repository, so a read-only token fails in seconds, not after the build.
  omni:
    name: OmniVoice pack
    needs: runtime
    if: github.ref_type == 'tag' || inputs.omni
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pip==$env:PIP_VERSION" "huggingface_hub==$env:HF_HUB_VERSION"
          npm ci --no-audit --no-fund

      - name: Check the Hugging Face upload access
        if: github.ref_type == 'tag' || inputs.publish
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python packaging/upload-packs.py --check
          if ($LASTEXITCODE -ne 0) { throw "The HF_TOKEN secret needs write access to the Hugging Face repository $env:HF_PACKS_REPO." }

      # The Mistral voice's reference clips are cut and encoded to MP3 at build time (bridge/voxtral-reference.mjs), so players need no ffmpeg.
      - name: ffmpeg (pre-builds the Mistral voice references)
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress; if ($LASTEXITCODE -ne 0) { throw 'Could not install ffmpeg.' } }
          $ffmpeg = Get-Command ffmpeg -ErrorAction Stop
          & $ffmpeg.Source -version | Select-Object -First 1

      - name: Build the OmniVoice pack
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          Get-PSDrive C | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
          node packaging/build-release.mjs --version "${{ needs.runtime.outputs.version }}" --packages omni `
            --models hf --out $env:OUT --cache $env:CACHE
          Remove-Item -Recurse -Force "$env:OUT\stage" -ErrorAction SilentlyContinue
          Get-ChildItem "$env:OUT\packages" -Filter *.zip | Format-Table Name, @{n='GB';e={[math]::Round($_.Length/1GB,2)}}

      - name: Upload the OmniVoice pack to Hugging Face
        if: github.ref_type == 'tag' || inputs.publish
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python packaging/upload-packs.py --version "${{ needs.runtime.outputs.version }}" --pack omni --packages "$env:OUT\packages"
          if ($LASTEXITCODE -ne 0) { throw "Uploading the OmniVoice pack to Hugging Face failed (the HF_TOKEN secret needs write access to $env:HF_PACKS_REPO)." }

  # The optional Mature packs (packaging/MATURE_PACK_README.md): opt-in only (the `mature` input, default off), so never on a tag push.
  # Two packs, lite and good, one model each, built and uploaded by one job each; they live on Hugging Face only, never Nexus and not the
  # GitHub release. Each model comes from the private bucket's mirror (HF_TOKEN), with the pinned public URL as fallback.
  mature:
    name: Mature pack (${{ matrix.tier }})
    needs: runtime
    if: inputs.mature
    runs-on: windows-2025
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        tier: [lite, good]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pip==$env:PIP_VERSION" "huggingface_hub==$env:HF_HUB_VERSION"
          npm ci --no-audit --no-fund

      - name: Check the Hugging Face upload access
        if: inputs.publish
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python packaging/upload-packs.py --check
          if ($LASTEXITCODE -ne 0) { throw "The HF_TOKEN secret needs write access to the Hugging Face repository $env:HF_PACKS_REPO." }

      - name: Build the Mature pack
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          Get-PSDrive C | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
          node packaging/build-release.mjs --version "${{ needs.runtime.outputs.version }}" --packages "mature-${{ matrix.tier }}" `
            --models hf --out $env:OUT --cache $env:CACHE
          Remove-Item -Recurse -Force "$env:OUT\stage" -ErrorAction SilentlyContinue
          Get-ChildItem "$env:OUT\packages" -Filter *.zip | Format-Table Name, @{n='GB';e={[math]::Round($_.Length/1GB,2)}}

      - name: Upload the Mature pack to Hugging Face
        if: inputs.publish
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python packaging/upload-packs.py --version "${{ needs.runtime.outputs.version }}" --pack "mature-${{ matrix.tier }}" --packages "$env:OUT\packages"
          if ($LASTEXITCODE -ne 0) { throw "Uploading the Mature pack to Hugging Face failed (the HF_TOKEN secret needs write access to $env:HF_PACKS_REPO)." }

  localai:
    name: Local AI pack (${{ matrix.tier }})
    needs: runtime
    if: github.ref_type == 'tag' || inputs.localai
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        tier: [standard, lite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build tools
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "pip==$env:PIP_VERSION" "huggingface_hub==$env:HF_HUB_VERSION"

      - name: Check the Hugging Face upload access
        if: github.ref_type == 'tag' || inputs.publish
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python packaging/upload-packs.py --check
          if ($LASTEXITCODE -ne 0) { throw "The HF_TOKEN secret needs write access to the Hugging Face repository $env:HF_PACKS_REPO." }

      # The packs hold unmodified upstream files (the llama.cpp build and the GGUF models), each downloaded from its pinned
      # URL and checked against the SHA-256 in packaging/release.config.json. The build needs no secret.
      - name: Build the Local AI pack
        shell: pwsh
        run: |
          Get-PSDrive C | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
          node packaging/build-release.mjs --version "${{ needs.runtime.outputs.version }}" --packages "localai-${{ matrix.tier }}" `
            --models hf --out $env:OUT --cache $env:CACHE
          Remove-Item -Recurse -Force "$env:OUT\stage" -ErrorAction SilentlyContinue
          Get-ChildItem "$env:OUT\packages" -Filter *.zip | Format-Table Name, @{n='GB';e={[math]::Round($_.Length/1GB,2)}}

      - name: Upload the Local AI pack to Hugging Face
        if: github.ref_type == 'tag' || inputs.publish
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python packaging/upload-packs.py --version "${{ needs.runtime.outputs.version }}" --pack "localai-${{ matrix.tier }}" --packages "$env:OUT\packages"
          if ($LASTEXITCODE -ne 0) { throw "Uploading the Local AI pack to Hugging Face failed (the HF_TOKEN secret needs write access to $env:HF_PACKS_REPO)." }
