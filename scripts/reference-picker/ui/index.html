<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Reference picker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="bar-row">
    <h1>Reference picker</h1>
    <div id="queue" class="pill" title="Render queue">Idle</div>
    <div class="spacer"></div>
    <label class="check"><input type="checkbox" id="autogen" checked> Generate after reroll</label>
  </div>
  <div class="bar-row">
    <input id="search" type="search" placeholder="Filter voices" autocomplete="off">
    <select id="status" aria-label="Status filter">
      <option value="all">All voices</option>
      <option value="proposal">With a proposed set</option>
      <option value="undecided">Nothing kept yet</option>
      <option value="kept">Something kept</option>
      <option value="rejected">Has rejections</option>
    </select>
    <button id="gen-listed" title="Queue sample generation for every voice listed below">Generate samples for listed voices</button>
    <span id="count" class="muted"></span>
  </div>
</header>
<main id="list" aria-live="polite"></main>
<div id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
